name: CI/CD
 
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: read
 
env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: pedestrian-seg-api
  IMAGE_TAG: v2
 
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
 
  test:
    name: Unit & parity tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest
 
  docker:
    name: Docker build & smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name seg-api -p 8000:8000 "$IMAGE_NAME:$IMAGE_TAG"
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          exit 1
      - name: Verify health payload
        run: |
          curl -fsS http://127.0.0.1:8000/health \
            | jq -e '.status == "healthy" and .model_loaded == true'
      - name: Smoke test /predict
        run: |
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > /tmp/pixel.png
          curl -fsS -F "file=@/tmp/pixel.png;type=image/png" http://127.0.0.1:8000/predict \
            | jq -e 'has("mask_base64") and has("inference_time_ms") and (.original_shape == [1, 1])'
      - name: Show container logs
        if: failure()
        run: docker logs seg-api
      - name: Remove container
        if: always()
        run: docker rm -f seg-api
 