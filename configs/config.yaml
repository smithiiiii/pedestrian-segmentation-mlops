model:
  encoder_name: resnet34
  encoder_weights: null        # weights come from the checkpoint, no ImageNet download at inference
  in_channels: 3
  classes: 1
  checkpoint_path: models/best_model.pt   # relative to the project root

preprocessing:
  image_size: [256, 256]       # [height, width] - must match training
  mean: [0.485, 0.456, 0.406]  # ImageNet
  std: [0.229, 0.224, 0.225]   # ImageNet

inference:
  default_threshold: 0.50

training:
  batch_size: 8
  epochs: 20
  learning_rate: 0.0003
  num_workers: 0               # 0 is safest on Windows
  seed: 42
